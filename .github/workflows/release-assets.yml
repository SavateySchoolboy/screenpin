name: Attach macOS builds
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful macOS build run ID
        required: true
        type: string
      release_tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScreenPin-macOS
          path: mac-builds
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Attach disk images to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" mac-builds/*.dmg --clobber
